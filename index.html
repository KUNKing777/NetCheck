<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCheck - Network Diagnostics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="scanline"></div>

    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-network-wired"></i>
                <span>NetCheck</span>
                <small>Network Diagnostics Tool</small>
            </div>
            <button class="btn-refresh" onclick="runAllChecks()">
                <i class="fas fa-sync-alt"></i> Run Check
            </button>
        </div>
    </header>

    <main class="container">
        <!-- IP Info -->
        <section class="card" id="ipCard">
            <div class="card-header">
                <i class="fas fa-globe"></i>
                <h2>IP Information</h2>
                <span class="status" id="ipStatus"><i class="fas fa-spinner fa-spin"></i></span>
            </div>
            <div class="card-body">
                <div class="ip-grid">
                    <div class="ip-item">
                        <label>IP Address</label>
                        <span id="ipAddress" class="mono">--</span>
                    </div>
                    <div class="ip-item">
                        <label>Location</label>
                        <span id="ipLocation">--</span>
                    </div>
                    <div class="ip-item">
                        <label>ISP</label>
                        <span id="ipISP">--</span>
                    </div>
                    <div class="ip-item">
                        <label>ASN</label>
                        <span id="ipASN" class="mono">--</span>
                    </div>
                    <div class="ip-item">
                        <label>Country</label>
                        <span id="ipCountry">--</span>
                    </div>
                    <div class="ip-item">
                        <label>Timezone</label>
                        <span id="ipTimezone" class="mono">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Network Environment -->
        <section class="card" id="envCard">
            <div class="card-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Network Environment</h2>
                <span class="status" id="envStatus"><i class="fas fa-spinner fa-spin"></i></span>
            </div>
            <div class="card-body">
                <div class="env-grid">
                    <div class="env-item">
                        <label>Connection Type</label>
                        <span id="connType">--</span>
                    </div>
                    <div class="env-item">
                        <label>Effective Type</label>
                        <span id="connEffective">--</span>
                    </div>
                    <div class="env-item">
                        <label>Downlink</label>
                        <span id="connDownlink">--</span>
                    </div>
                    <div class="env-item">
                        <label>RTT</label>
                        <span id="connRTT">--</span>
                    </div>
                    <div class="env-item">
                        <label>Data Saver</label>
                        <span id="connDataSaver">--</span>
                    </div>
                    <div class="env-item">
                        <label>Online Status</label>
                        <span id="connOnline">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Latency Test -->
        <section class="card" id="latencyCard">
            <div class="card-header">
                <i class="fas fa-tachometer-alt"></i>
                <h2>Latency Test</h2>
                <span class="status" id="latencyStatus"><i class="fas fa-spinner fa-spin"></i></span>
            </div>
            <div class="card-body">
                <div class="latency-list" id="latencyList">
                    <!-- Generated by JS -->
                </div>
            </div>
        </section>

        <!-- Connectivity Test -->
        <section class="card" id="connectCard">
            <div class="card-header">
                <i class="fas fa-server"></i>
                <h2>Service Connectivity</h2>
                <span class="status" id="connectStatus"><i class="fas fa-spinner fa-spin"></i></span>
            </div>
            <div class="card-body">
                <div class="connect-grid" id="connectGrid">
                    <!-- Generated by JS -->
                </div>
            </div>
        </section>

        <!-- DNS Test -->
        <section class="card" id="dnsCard">
            <div class="card-header">
                <i class="fas fa-search"></i>
                <h2>DNS Resolution</h2>
                <span class="status" id="dnsStatus"><i class="fas fa-spinner fa-spin"></i></span>
            </div>
            <div class="card-body">
                <div class="dns-list" id="dnsList">
                    <!-- Generated by JS -->
                </div>
            </div>
        </section>

        <!-- Summary -->
        <section class="card summary-card" id="summaryCard">
            <div class="card-header">
                <i class="fas fa-clipboard-check"></i>
                <h2>Summary</h2>
            </div>
            <div class="card-body">
                <div class="summary-content" id="summaryContent">
                    <p class="text-muted">Click "Run Check" to start diagnostics...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>NetCheck &mdash; Pure static network diagnostics tool</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
